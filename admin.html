<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área privada • Azilê 90</title><link rel="stylesheet" href="/style.css"></head><body><main class="app-shell"><section class="screen active"><div class="invite-card content-card"><div class="floral floral-tl">🌹🌿</div><h1 class="script page-title">Área Privada</h1><p class="lead">Painel de confirmações do aniversário de Azilê.</p><section id="authBox"><form id="authForm" class="form-stack"><label>E-mail<input id="email" type="email" value="jricchieiro@gmail.com" readonly></label><label>Senha<input id="password" type="password" minlength="6" required placeholder="Sua senha"></label><button class="primary" id="loginBtn">Entrar</button><button class="secondary" type="button" id="signupBtn">Criar meu acesso</button></form><p id="authStatus" class="status hidden"></p></section><section id="dashboard" class="hidden"><div class="admin-stats"><div class="stat"><strong id="s1">0</strong><span>Confirmações</span></div><div class="stat"><strong id="s2">0</strong><span>Acompanhantes</span></div><div class="stat"><strong id="s3">0</strong><span>Total de pessoas</span></div></div><div class="admin-actions"><button class="secondary" id="refreshBtn">Atualizar</button><button class="primary" id="logoutBtn">Sair</button></div><div id="guestList" class="guest-list"></div><p id="empty" class="status hidden">Ainda não há confirmações.</p></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin.js"></script></body></html>
